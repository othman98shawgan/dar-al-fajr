name: dar_al_fajr
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  carousel_slider: ^5.1.1
  url_launcher: ^6.3.1
  web: ^1.0.0
  visibility_detector: ^0.4.0+2
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.3.2
  photo_view: ^0.15.0
  flutter_localizations:
    sdk: flutter
  js_interop: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700

    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo/Heebo-Regular.ttf
        - asset: assets/fonts/Heebo/Heebo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Heebo/Heebo-Bold.ttf
          weight: 700

    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-Bold.ttf
          weight: 700
