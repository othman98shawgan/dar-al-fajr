name: Deploy Flutter Web to GitHub Pages (Actions)

on:
  push:
    branches: [develop] # change if you deploy from main
  workflow_dispatch:

# Required for the official Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - run: flutter pub get

      # If you're using a project page (https://user.github.io/repo/), keep base-href=/repo/
      # If you're using a custom domain, change to --base-href=/
      - name: Build web (release)
        run: flutter build web --release --base-href=/

      # SPA fallback for GitHub Pages (still needed)
      - name: Add 404.html for SPA
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
