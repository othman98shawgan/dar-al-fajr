name: Deploy Flutter Web to GitHub Pages (Actions)

on:
  push:
    branches: [ develop ]   # change if you deploy from main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - run: flutter pub get

      # Custom domain => root path
      - name: Build web (release)
        run: flutter build web --release --base-href=/

      # SPA fallback for GitHub Pages
      - name: Add 404.html for SPA
        run: cp build/web/index.html build/web/404.html

      - name: Write CNAME for Pages
        run: echo www.daralfajr.org > build/web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
