<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="dar_al_fajr" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <link rel="preload" as="image" href="assets/images/logo.png" crossorigin />

    <title>Dar al-Fajr</title>
    <link rel="manifest" href="manifest.json" />
    <!-- Brand.green for address bar -->
    <meta name="theme-color" content="#006C5B" />

    <!-- Open Graph (used by Facebook, WhatsApp, Telegram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dar al-Fajr" />
    <meta property="og:title" content="Dar al-Fajr — Qur’an Education Center" />
    <meta
      property="og:description"
      content="Join us in our mission to spread knowledge and understanding of the Qur’an."
    />
    <meta property="og:url" content="https://www.daralfajr.org/" />
    <meta property="og:image" content="https://www.daralfajr.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dar al-Fajr — Qur’an Education Center" />
    <meta
      name="twitter:description"
      content="Join us in our mission to spread knowledge and understanding of the Qur’an."
    />
    <meta name="twitter:image" content="https://www.daralfajr.org/og-image.jpg" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
